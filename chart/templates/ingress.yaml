{{- if .Values.ingress.hbbs5tcp.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "rustdesk-server.fullname" . }}-hbbs5tcp-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rustdesk-server.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  entryPoints:
    - {{ .Values.ingress.hbbs5tcp.traefik.entrypoint }}
  routes:
  - match: HostSNI(`*`)
    services:
    - name: {{ include "rustdesk-server.fullname" . }}-svc
      port: 21115
      weight: {{ .Values.ingress.hbbs5tcp.weight }}
      terminationDelay: {{ .Values.ingress.hbbs5tcp.terminationDelay }}
{{- end }}

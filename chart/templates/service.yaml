---
kind: Service
apiVersion: v1
metadata:
  name: {{ include "rustdesk-server.fullname" . }}-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rustdesk-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" | quote }}
  ports:
  - port: 21115
    name: hbbs5
    protocol: TCP
    targetPort: 21115
  - port: 21116
    name: hbbs6
    protocol: TCP
    targetPort: 21116
  - port: 21116
    name: hbbs6udp
    protocol: UDP
    targetPort: 21116
  - port: 21118
    name: hbbs8
    protocol: TCP
    targetPort: 21118
  - port: 21117
    name: hbbr7
    protocol: TCP
    targetPort: 21117
  - port: 21119
    name: hbbr9
    protocol: TCP
    targetPort: 21119
  selector:
    {{- include "rustdesk-server.selectorLabels" . | nindent 4 }}

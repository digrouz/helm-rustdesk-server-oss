# CI Workflow for the rustdesk-server Helm chart
name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  helm-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - uses: actions/setup-python@main
        with:
          python-version: '3.13'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@main

      - name: List changed charts
        id: list-changed
        run: |
          ## If executed with debug this won't work anymore.
          changed=$(ct --config ./.github/configs/ct.yaml list-changed)
          charts=$(echo "$changed" | tr '\n' ' ' | xargs)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "changed_charts=$charts" >> $GITHUB_OUTPUT
          fi

      - name: Run chart-testing (lint)
        run: ct lint --debug --config ./.github/configs/ct.yaml --lint-conf ./.github/configs/lintconf.yaml

      - name: Create kind cluster
        uses: helm/kind-action@main
        if: steps.list-changed.outputs.changed == 'true'

      - name: Run chart-testing (install)
        # The kind cluster has no "longhorn" StorageClass (the chart default),
        # which would leave the PVC unbound and the pod unschedulable.
        # Override the data volume with an ephemeral emptyDir for the test.
        run: ct install --config ./.github/configs/ct.yaml --set persistence.data.type=emptyDir
        if: steps.list-changed.outputs.changed == 'true'
